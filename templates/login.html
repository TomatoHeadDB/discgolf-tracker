{% extends "base.html" %}
{% block title %}Log in — Disc Golf Tracker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>🥏 Disc Golf Tracker</h1>
  <p class="subtitle">Log in to your bag</p>
  <form method="POST">
    <label>Username or email
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="auth-switch">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
